# Root manifest only exists so deskpet can be embedded as a workspace member.
# Every other tool is an independent crate built from its own directory, so it
# must be listed in `exclude`; otherwise cargo refuses to build it
# ("current package believes it's in a workspace when it's not").
[workspace]
resolver = "2"
members = ["deskpet"]
exclude = [
    "audiogen",
    "bulk_upload",
    "crates/murmur",
    "crates/rlit_cli",
    "gamereel",
    "group_vibe_workbench",
    "img_resize",
    "looplog",
    "maquette",
    "mj_atlas",
    "textexture",
    "ui-trim",
]
