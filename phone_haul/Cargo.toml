[package]
name = "phone_haul"
version = "0.1.0"
edition = "2021"
description = "Phone media migration: Android (adb + agent) and iOS (pure-Rust AFC), dedup-aware, time-ordered"
default-run = "phone_haul"

[lib]
name = "phone_haul"
path = "src/lib.rs"

[[bin]]
name = "phone_haul"
path = "src/host/main.rs"
required-features = ["host"]

[[bin]]
name = "phone_haul_agent"
path = "src/agent/main.rs"

[features]
default = ["host"]
host = ["dep:clap", "dep:redb", "dep:tokio", "dep:idevice", "dep:rusqlite", "dep:kamadak-exif", "dep:libc", "dep:rlit_cli"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
rlit_cli = { path = "../crates/rlit_cli", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
redb = { version = "2", optional = true }

# zigbuild 交叉到 Android 时没有 libc 头, blake3 的 C NEON 编不过;
# agent 用 pure Rust 后端(吞吐 >> adb 通道, 不是瓶颈); host 保留原生 SIMD 后端
tokio = { version = "1", features = ["rt", "macros", "net", "time"], optional = true }
libc = { version = "0.2", optional = true }
idevice = { version = "0.1.68", features = ["afc", "usbmuxd"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
kamadak-exif = { version = "0.5", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
blake3 = { version = "1", features = ["pure"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
blake3 = "1"

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
