[package]
name = "looplog"
version = "0.1.0"
edition = "2024"
description = "Local-first log intake and query CLI for AI-assisted debugging"

# 独立 crate：仓库根 Cargo.toml 的 workspace 只含 deskpet，这里显式声明自己的 workspace
[workspace]

[features]
default = []
pure-rust-sqlite = []

[dependencies]
rlit_cli = { path = "../crates/rlit_cli" }
clap = { version = "^4", features = ["derive"] }
dirs = "5"
humantime = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
toml = "0.8"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
panic = "abort"
strip = true
opt-level = "z"
