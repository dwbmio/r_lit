    - c3_1
    - c3_2
    label: 小捆流调用
    bus_slot: 0.18
  - kind: bus
    from:
    - c2_3
    to:
    - c3_3
    - c3_4
    - c3_5
    label: 班车流调用
    bus_slot: 0.83
  - kind: direct
    from:
    - c2_1
    to:
    - c2_2
  - kind: direct
    from:
    - c2_2
    to:
    - c2_3
  - kind: direct
    from:
    - c2_3
    to:
    - c2_4
  - kind: loop_left
    from:
    - c2_2
    to:
    - c2_4
  - kind: direct
    from:
    - c3_2
    to:
    - c4_1
  - kind: bottom_route
    from:
    - c2_4
    to:
    - c4_2
  callouts:
  - title: 方案平台创参：POST /api/fc/solution/add_mini_bundle_auto
    accent: purple
    style: code_box
    lines:
    - text: platform, way_type, way, experiment_type
      mono: true
    - text: solution_type, other_sol_type_name, list_tag_data[], way_notes
      mono: true
    - text: origin_param { workflow_id, caller }   ← caller 已有，不动
      mono: true
      tone: amber
    - text: bbc_api_version  "v1" | "v2"       ← 新增
      mono: true
      tone: emerald
  - title: 改动一句话
    accent: emerald
    style: bullets
    lines:
    - text: 只加一个值：创建时选 bbc_api_version（接口 v1 / v2）
    - text: 5 个平台的调用全部带上；项管的两次调用保持「不涉及版本」
    - text: caller 一字未动，与接口版本互不推导
    - text: 存量默认 v1；四处一致性巡检（主表 / 班车流 / 方案期次 / 回调）
  warning:
    title: ⚠ 别忘了打包（Jenkins）这一跳
    body: 若底层底板有变动，需按 bbc_api_version 判断是否追加底板方案 / 底版包；本次先按「透传版本」落，底板规则确认后再补，别只改方案平台那一层。
  footer: 依据：star-flow internal/data/http_*.go（出站）· api/**/*.proto（入站）· n8n 方案准备流程 · hs-code-keeper/bbc/api/fc · solutionhub/block_blast
flow_table:
  id: flowtable
  heading: 三、入口 → 星链 → 下游服务
  note: 只列这次相关的三条链路：小捆自动化流、发版班车流、回调。每行 = 一个入口 + 它打到的星链接口 + 星链再去调的服务与接口。
  groups:
  - name: 小捆自动化流
    tone: blue
    rows:
    - action: 创建方案
      trigger: 前端
      version: v1 · 云效
      version_tone: blue
      entry:
      - POST /flow/st_wf_solution_mini_bundle_auto/v1/create
      downstream:
      - n8n GET {n8n}/wf/mb/get_init_layer（初始化）
      - 建 st_workflow
      - caller = ""（云效）
      note: 一个弹窗；create_kind 普通/专项是参数
    - action: 创建方案
      trigger: 前端
      version: v2 · BB 项管
      version_tone: purple
      entry:
      - POST /flow/st_wf_solution_mini_bundle_auto/v2/create
      downstream:
      - n8n GET {n8n}/wf/mb/get_init_layer（初始化）
      - 建 st_workflow
      - caller = "BB Project Management"
      note: 来源选 BB 项管时走这条
    - action: 刷新迭代
      trigger: 前端 · n8n
      version: v1 · 云效
      version_tone: blue
      entry:
      - POST /flow/solution-mini-bundle-auto/create-iteration/v1/refresh-iteration-callback
      downstream:
      - 云效 POST /oapi/v1/projex/organizations/{org}/workitems:search
      - 方案平台 POST /api/fc/solution/add_mini_bundle_auto
      note: 重拉需求 → 对账 → 增删方案
    - action: 刷新迭代
      trigger: BB 项管
      version: v2 · BB 项管
      version_tone: purple
      entry:
      - POST /flow/solution-mini-bundle-auto/create-iteration/v2/refresh-iteration-callback
      downstream:
      - BB 项管 POST /oapi/v1/projex/organizations/{org}/workitems:search
      - 方案平台 POST /api/fc/solution/add_mini_bundle_auto
      note: 与 v1 同一套逻辑，项管换成 BB
    - action: 刷新期次（卡片）
      trigger: 前端 · BBC
      version: v1 · 云效
      version_tone: blue
      entry:
      - POST /flow/solution-mini-bundle-auto/create-iteration/v1/refresh-way-callback
      downstream:
      - 云效 POST /oapi/v1/projex/organizations/{org}/workitems:search
      - 方案平台 POST /api/fc/solution/add_mini_bundle_auto
      note: 只刷某一个期次；BBC 叫 post_flow_mini_bundle_auto_refresh；**v2 缺这条**
    - action: N8N 方案准备
      trigger: n8n
      version: v1 · 云效
      version_tone: blue
      entry:
      - POST /flow/solution-mini-bundle-auto/create-iteration/v1/yunxiao-create-iteration
      downstream:
      - 云效 POST /oapi/v1/projex/organizations/{org}/projects/{p}/sprints
      - 云效 POST …/workitems:search
      - 方案平台 POST /api/fc/solution/add_mini_bundle_auto
      note: 方案准备主流程
    - action: N8N 方案准备
      trigger: n8n
      version: v2 · BB 项管
      version_tone: purple
      entry:
      - POST /flow/solution-mini-bundle-auto/create-iteration/v2/yunxiao-create-iteration
      downstream:
      - BB 项管 POST /oapi/v1/projex/organizations/{org}/projects/{p}/sprints
      - BB 项管 POST …/workitems:search
      - 方案平台 POST /api/fc/solution/add_mini_bundle_auto
      note: 项管换成 BB
    - action: 建发版班车
      trigger: n8n
      version: —
      version_tone: muted
      entry:
      - POST /flow/solution-mini-bundle-auto/create-iteration/v1/create-release-shuttle-bus
      downstream:
      - 落库 st_wf_release_shuttle_bus_flow + st_wf_rsbf_period
      - n8n POST {n8n}/wf/release_shuttle_bus_flow/exec_start
      note: 小捆流建完后创建班车流
    - action: 改迭代名
      trigger: 前端
      version: v1 · 云效
      version_tone: blue
      entry:
      - POST /flow/solution-mini-bundle-auto/create-iteration/v1/update-iteration-name
      downstream:
      - 云效 PUT /oapi/v1/projex/organizations/{org}/workitems/{id}
      - 更新工作流内落库的名称
      note: 同步云效侧与卡片里的名称
    - action: 改迭代名
      trigger: 前端
      version: v2 · BB 项管
      version_tone: purple
      entry:
      - POST /flow/solution-mini-bundle-auto/create-iteration/v2/update-iteration-name
      downstream:
      - BB 项管 PUT /oapi/v1/projex/organizations/{org}/workitems/{id}
      - 更新工作流内落库的名称
      note: 项管换成 BB
  - name: 发版班车流
    tone: orange
    rows:
    - action: 特性冲突检测
      trigger: 前端
      version: —
      version_tone: muted
      entry:
      - POST /flow/release-shuttle-bus-flow/solution-preparation/feature-conflict-check
      downstream:
      - 方案平台 GET /api/st/wf/get_conflict_report
      note: 同 Key 特性跨层检查
    - action: 构建测试包
      trigger: 前端
      version: v1 · 云效
      version_tone: blue
      entry:
      - POST /flow/release-shuttle-bus-flow/build-package/package-create
      downstream:
      - n8n POST {n8n}/api/st/receive-data → Jenkins job
      note: 星链不直接触发 Jenkins，由 n8n 触发
    - action: 构建测试包
      trigger: BB 项管
      version: v2 · BB 项管
      version_tone: purple
      entry:
      - POST /flow/release-shuttle-bus-flow/build-package/v2/package-create
      downstream:
      - n8n POST {n8n}/api/st/receive-data → Jenkins job
      note: 项管换成 BB
    - action: 黑盒测试
      trigger: 前端
      version: —
      version_tone: muted
      entry:
      - GET /flow/release-shuttle-bus-flow/testing-phase/blackbox-test-query
      downstream:
      - 方案平台 GET /api/fc/solution/get_list
      - 读包体记录
      note: 查黑盒包体结果
    - action: 代码审核 · 初审
      trigger: 前端
      version: —
      version_tone: muted
      entry:
      - POST /flow/release-shuttle-bus-flow/build-package/code-review-appointment-initial
      downstream:
      - 代码审核 POST /api/block-blast/release-review（reviewCount=1）
      note: 打包完成后预约
    - action: 代码审核 · 复审
      trigger: 前端 · n8n
      version: —
      version_tone: muted
      entry:
      - POST /flow/release-shuttle-bus-flow/testing-phase/code-review-appointment-re
      downstream:
      - 代码审核 POST /api/block-blast/release-review（reviewCount≥2）
      note: 与初审同一个接口
    - action: 机器人测试
      trigger: 前端
      version: —
      version_tone: muted
      entry:
      - POST /flow/release-shuttle-bus-flow/testing-phase/robot-task/create
      downstream:
      - 机器人 POST /robot/oapi/task/create
      note: 回调 /flow/callback/robot-test
    - action: 正交自动化
      trigger: 前端
      version: —
      version_tone: muted
      entry:
      - POST /flow/release-shuttle-bus-flow/testing-phase/package-create
      downstream:
      - n8n POST {n8n}/api/st/receive-data → 测试平台
      note: 先出正交包再触发
    - action: 主流程自动化
      trigger: n8n
      version: —
      version_tone: muted
      entry:
      - POST /flow/release-shuttle-bus-flow/testing-phase/main-process-automation-test
      downstream:
      - 测试平台 POST /api/v1/smoke_test/main_case_starlink
      note: 回调 /flow/callback/main-process-test
    - action: 性能测试
      trigger: n8n
      version: —
      version_tone: muted
      entry:
      - POST /flow/release-shuttle-bus-flow/testing-phase/performance-test
      downstream:
      - 测试平台 POST /api/v1/performance_test/performance_case
      note: 回调 /flow/callback/performance-test
    - action: 热更（发版后）
      trigger: 前端
      version: —
      version_tone: muted
      entry:
      - POST /flow/release-shuttle-bus-flow/release-phase/local-hotfix-automation-test
      - GET …/release-phase/hotfix-domains、hotfix-projects
      downstream:
      - n8n 热更 webhook / 打包服务
      note: 安卓 + iOS 共 6 张卡
  - name: BBC 回调（BBC → 星链）
    tone: purple
    rows:
    - action: 刷新期次
      trigger: BBC
      version: v1 · 云效
      version_tone: blue
      entry:
      - POST /flow/solution-mini-bundle-auto/create-iteration/v1/refresh-way-callback
      downstream:
      - 同「刷新期次」：云效拉需求 + 方案平台建方案
      note: BBC 函数 post_flow_mini_bundle_auto_refresh
    - action: 对比云效与输入
      trigger: BBC
      version: v1 · 云效
      version_tone: blue
      entry:
      - POST /flow/solution-mini-bundle-auto/create-iteration/v1/compare-yunxiao-with-input-starlink
      downstream:
      - 云效 POST …/workitems:search
      - 方案平台读方案
      note: BBC 函数 post_flow_mini_bundle_auto_compare_yunxiao_with_input
    - action: 冲突检测完成
      trigger: BBC
      version: v1 · 云效
      version_tone: blue
      entry:
      - POST /flow/solution-mini-bundle-auto/create-iteration/v1/conflict-detection-callback
      downstream:
      - 只落库 + 更新卡片（不再外调）
      note: BBC 函数 post_flow_conflict_check_finished
    - action: 查锁定状态
      trigger: BBC
      version: v1 · 云效
      version_tone: blue
      entry:
      - POST /flow/solution-mini-bundle-auto/create-iteration/v1/query-lock-status
      downstream:
      - 只读，无外调
      note: BBC 函数 post_flow_query_mini_bundle_lock_status
    - action: 底版变更
      trigger: BBC
      version: v1 · 云效
      version_tone: blue
      entry:
      - POST /flow/solution-mini-bundle-auto/create-iteration/v1/change-baseline-callback
      downstream:
      - 只落库 + 更新卡片
      - （DMP 底版：added / removed / same tags）
      note: BBC 函数 post_flow_change_baseline_callback
  - name: 通用回调
    tone: green
    rows:
    - action: 打包 / 审核 / 测试结果
      trigger: 外部平台 · n8n
      version: —
      version_tone: muted
      entry:
      - POST /flow/callback/package-update
      - POST /flow/callback/code-review-appointment
      - POST /flow/callback/{robot-test,main-process-test,performance-test}
      downstream:
      - 只落库 + 更新卡片
      note: 回调统一入口
    - action: 热更 / 版本发布
      trigger: 外部平台 · n8n
      version: —
      version_tone: muted
      entry:
      - POST /flow/callback/{local-hot-update,online-hot-update,local-hotfix-automation-test}
      - POST /flow/callback/version-release/{publish-review,publish-status}
      downstream:
      - 只落库 + 更新卡片
      note: 发版后链路
  hint: 本表不含 star-flow 其它业务域（专项流、麻将等）。BBC 写死 `/v1/`，要支持第 6 点「刷新/通知区分版本」，**v2 还缺 refresh-way-callback 与 4 个通知类回调**。
