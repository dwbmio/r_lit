[workspace]
resolver = "2"
members = [
    "crates/distill-proto",
    "crates/distill-crypto",
    "crates/distill-git",
    "crates/distill-semantic",
    "crates/distill-index",
    "crates/distill-server",
    "crates/distill-client",
]

[workspace.package]
version = "1.1.1"
edition = "2024"

[profile.release]
lto = true
panic = "abort"
strip = true
opt-level = "z"

[workspace.dependencies]
anyhow = "1.0"
arboard = { version = "3.4", default-features = false }
blake3 = "1.8"
chacha20poly1305 = "0.10"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.28"
dashmap = "6.1"
dirs = "6.0"
gix = { version = "0.78", default-features = false, features = ["revision", "blob-diff"] }
governor = "0.10"
hex = "0.4"
hkdf = "0.12"
iroh = "1.5"
lru = "0.19"
memchr = "2.7"
oxc_allocator = "0.130"
oxc_ast = "0.130"
oxc_parser = "0.130"
oxc_span = "0.130"
postcard = { version = "1.1", features = ["alloc"] }
pulldown-cmark = "0.13"
rand = "0.8"
ratatui = "0.29"
rayon = "1.10"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tantivy = "0.27"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1.54", features = ["full"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.2"

distill-proto = { path = "crates/distill-proto" }
distill-crypto = { path = "crates/distill-crypto" }
distill-git = { path = "crates/distill-git" }
distill-semantic = { path = "crates/distill-semantic" }
distill-index = { path = "crates/distill-index" }
