[package]
name = "archcast"
version = "0.1.0"
edition = "2024"
authors = ["R_LIT Contributors"]
description = "AI-first deterministic architecture & flow report compiler (SIMD + Rayon + optional WebGPU) generating 1:1 HTML+SVG briefs, standalone SVGs, raster/animated exports, and canonical Markdown"
license = "MIT OR Apache-2.0"

[features]
default = ["raster"]
# Pure-Rust SIMD SVG rasterization (PNG + layered minimal-bounds animated GIF)
raster = ["dep:resvg", "dep:gif", "dep:color_quant"]
# Optional WebGPU WGSL compute shader backend (Metal/Vulkan/DX12) for GPU-accelerated minimal-region animation compositing
gpu = ["raster", "dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
rlit_cli = { path = "../crates/rlit_cli" }
clap = { version = "4", features = ["cargo", "derive"] }
log = "0.4"
memchr = "2"
rayon = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
walkdir = "2"
wide = "0.7"

# Raster & animated GIF export (pure Rust, zero C/system dependencies)
resvg = { version = "0.46", optional = true }
gif = { version = "0.14", optional = true }
color_quant = { version = "1", optional = true }

# Optional GPU backend dependencies
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
panic = "abort"
strip = true
opt-level = "z"
