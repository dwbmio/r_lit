[package]
name = "mailctl"
version = "0.1.0"
edition = "2021"
description = "Multi-account IMAP/SMTP dispatcher with guard rails (allowlist, confirm, audit)"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
encoding_rs = "0.8"
clap = { version = "4", features = ["derive"] }
rustls = "0.23"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
webpki-roots = "1"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# 独立 crate：不加入 r_lit 根 workspace（与 bulk_upload/img_resize 等工具一致）
[workspace]
