[package]
name = "rlit_cli"
version = "0.1.0"
edition = "2021"
authors = ["R_LIT Contributors"]
description = "Shared machine-call contract for r_lit CLIs: JSON envelope, exit codes, artifacts and `__schema` export"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
